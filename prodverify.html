<!doctype html>
<html><head><meta charset="utf-8"><title>prodverify</title></head>
<body>
<script type="module">
import { FFmpeg } from './assets/vendor/ffmpeg/index.js';

function fileToUint8Array(file){
  return new Promise(function(resolve, reject){
    const reader = new FileReader();
    reader.onload = function(){ resolve(new Uint8Array(reader.result)); };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}
function captureFrame(videoBytes, seekTo){
  return new Promise(function(resolve, reject){
    const blob = new Blob([videoBytes.buffer], { type: 'video/mp4' });
    const url = URL.createObjectURL(blob);
    const vid = document.createElement('video');
    vid.muted = true; vid.playsInline = true; vid.preload = 'auto'; vid.src = url;
    vid.addEventListener('loadedmetadata', function(){ vid.currentTime = Math.min(seekTo, (vid.duration||2)/2); });
    vid.addEventListener('seeked', function(){
      const canvas = document.createElement('canvas');
      canvas.width = vid.videoWidth; canvas.height = vid.videoHeight;
      canvas.getContext('2d').drawImage(vid, 0, 0);
      canvas.toBlob(function(b){ URL.revokeObjectURL(url); b.arrayBuffer().then(buf=>resolve(new Uint8Array(buf)), reject); }, 'image/jpeg', 0.85);
    });
    vid.addEventListener('error', function(){ reject(new Error('video element error')); });
    setTimeout(function(){ reject(new Error('poster timeout')); }, 15000);
  });
}

(async function(){
  try {
    const resp = await fetch('/prodtest.mp4');
    const blob = await resp.blob();
    const file = new File([blob], 'prodtest.mp4', {type:'video/mp4'});

    const f = new FFmpeg();
    await f.load({
      classWorkerURL: new URL('./assets/vendor/ffmpeg/worker.js', location.href).href,
      coreURL: new URL('./assets/vendor/ffmpeg/core/ffmpeg-core.js', location.href).href,
      wasmURL: new URL('./assets/vendor/ffmpeg/core/ffmpeg-core.wasm', location.href).href
    });
    await f.writeFile('in.mp4', await fileToUint8Array(file));
    await f.exec(['-i','in.mp4','-vf','scale=960:-2','-c:v','libx264','-preset','veryfast','-crf','27','-c:a','aac','-b:a','96k','-movflags','+faststart','out.mp4']);
    const videoBytes = await f.readFile('out.mp4');
    const posterBytes = await captureFrame(videoBytes, 1);
    const vsig = String.fromCharCode(videoBytes[4],videoBytes[5],videoBytes[6],videoBytes[7]);
    const jpgOk = (posterBytes[0]===0xFF && posterBytes[1]===0xD8);
    location.href = 'http://localhost:8001/__PRODRESULT__?ok=1&videoLen=' + videoBytes.length + '&posterLen=' + posterBytes.length + '&sig=' + vsig + '&jpg=' + jpgOk;
  } catch(e) {
    location.href = 'http://localhost:8001/__PRODRESULT__?ok=0&err=' + encodeURIComponent(e && e.message ? e.message : String(e));
  }
})();
</script>
</body></html>
